services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: unleash
      POSTGRES_USER: unleash_user
      POSTGRES_PASSWORD: local-postgres-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unleash_user -d unleash"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - unleash-postgres-data:/var/lib/postgresql/data

  unleash:
    image: unleashorg/unleash-server:latest
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4242:4242"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: unleash
      DATABASE_USERNAME: unleash_user
      DATABASE_PASSWORD: local-postgres-password
      DATABASE_SSL: "false"
      UNLEASH_URL: http://localhost:4242
      UNLEASH_DEFAULT_ADMIN_USERNAME: admin
      UNLEASH_DEFAULT_ADMIN_PASSWORD: LocalOnlyPass1!

volumes:
  unleash-postgres-data:
